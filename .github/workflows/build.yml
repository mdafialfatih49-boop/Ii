name: build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Block Fusion
        run: unzip -q Block-Fusion-Fabric-1.20.1-Source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build Block Fusion
        run: gradle build
        working-directory: block-fusion-mod

      - uses: actions/upload-artifact@v4
        with:
          name: Block-Fusion-Fabric-1.20.1
          path: block-fusion-mod/build/libs/*.jar
